name: probe2
on:
  push:
    branches: [probe2]
  workflow_dispatch:
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && cp ../../probe/e2e/embed-cards.js scripts/ && cp ../../probe/e2e/card-search.js src/ && node scripts/embed-cards.js --eval
        working-directory: main/build
