# Workflow temporaire : vérifie les services en ligne utilisables par le site (sera supprimé).
name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Tags Scryfall
        run: |
          for t in ramp mana-rock mana-dork card-advantage draw removal creature-removal spot-removal board-wipe sweeper tutor recursion reanimation protection gives-hexproof gives-indestructible counterspell sacrifice-outlet; do
            n=$(curl -s -H 'User-Agent: JugeMTG/1.0' "https://api.scryfall.com/cards/search?q=otag%3A$t+f%3Acommander&unique=cards" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('total_cards',d.get('details','?')))")
            echo "otag:$t => $n"; sleep 0.15
          done
      - name: Commander Spellbook bulk
        run: |
          for u in https://json.commanderspellbook.com/variants.json https://json.commanderspellbook.com/variants.json.gz https://backend.commanderspellbook.com/variants/?limit=1 ; do
            echo "== $u"; curl -s -I -H 'Origin: https://seboulo.github.io' "$u" | grep -i -E '^(HTTP|content-length|content-type|access-control|location)'
          done
          curl -s 'https://backend.commanderspellbook.com/variants/?limit=1' | head -c 1500; echo
          curl -s -o /tmp/v.json 'https://json.commanderspellbook.com/variants.json' && ls -la /tmp/v.json && python3 -c "
          import json;d=json.load(open('/tmp/v.json'));print(type(d), list(d.keys())[:10] if isinstance(d,dict) else len(d))
          v=d['variants'] if isinstance(d,dict) and 'variants' in d else d
          print(len(v)); print(json.dumps(v[0])[:2500])"
      - name: EDHREC slug of partner and average deck
        run: |
          curl -s -o /dev/null -w '%{http_code}\n' 'https://json.edhrec.com/pages/commanders/teysa-karlov.json'
          curl -s -o /dev/null -w '%{http_code}\n' 'https://json.edhrec.com/pages/commanders/atraxa-praetors-voice.json'
          curl -s -o /dev/null -w '%{http_code}\n' 'https://json.edhrec.com/pages/commanders/grist-the-hunger-tide.json'
